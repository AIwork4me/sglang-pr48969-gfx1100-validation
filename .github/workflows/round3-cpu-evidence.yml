name: Round 3 CPU-only evidence audit
on:
  push:
    branches:
      - validation/1da9ae2-w7900-round3
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  round3-audit:
    name: Final SHA evidence, 56-gate audit, negative tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR commit with source history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify commit identity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test -n "$(git rev-parse HEAD)"
      - name: Check shell and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n round3/scripts/audit_round3.sh
          bash -n round3/scripts/audit_selftest.sh
          bash -n round3/scripts/negtest_lib.sh
          python3 -m compileall -q round3/scripts
      - name: Verify final 899-entry sealed evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Ec '^[0-9a-f]{64}  ' round3/audit/SHA256SUMS)" -eq 899
          sha256sum -c --quiet round3/audit/SHA256SUMS
          echo "FINAL_MANIFEST_PASS 899/899"
      - name: Independently recompute all 56 CPU audit gates
        shell: bash
        run: |
          set -euo pipefail
          bash round3/scripts/audit_round3.sh | tee round3-ci-audit.log
          grep -qx 'AUDIT PASS' round3-ci-audit.log
      - name: Verify negative-test framework (six scenarios)
        shell: bash
        run: |
          set -euo pipefail
          python3 round3/scripts/test_audit_framework.py | tee round3-ci-framework.log
          grep -q 'framework unit tests: 6/6 PASS' round3-ci-framework.log
      - name: Reproduce all ten verified fault injections
        shell: bash
        run: |
          set -euo pipefail
          bash round3/scripts/audit_round3.sh --selftest | tee round3-ci-selftest.log
          grep -q 'SELFTEST PASS (10/10' round3-ci-selftest.log
      - name: Check physical GPU evidence unchanged since archive commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 5a6cee126160cde47ac708efb81e32ae95d49194 HEAD -- round3/evidence round3/results round3/audit/baseline_freeze.sha256 configs patches
          echo "GPU_ARCHIVE_UNCHANGED"
